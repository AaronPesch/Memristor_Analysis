name: Build Linux Executable
on:
  # Actions-tab
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies from Requirements
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt not found!"
            exit 1
          fi

      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libgl1

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --clean \
            --name "MemristorAnalysisTool" \
            --log-level DEBUG \
            --collect-all PySide6 \
            --collect-all plotly \
            --collect-all duckdb \
            --collect-all kaleido \
            --collect-all matplotlib \
            --collect-all polars \
            --collect-all svglib \
            --paths "src" \
            "src/app/main.py"

      - name: Archive Production Artifact
        # 'dist/MemristorAnalysisTool'
        # zip
        run: |
          cd dist
          zip -r ../MemristorAnalysisTool_Linux.zip MemristorAnalysisTool

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MemristorAnalysisTool-Linux-Build
          path: MemristorAnalysisTool_Linux.zip
          retention-days: 5

      - name: Install Xvfb for headless GUI testing
        run: sudo apt-get install -y xvfb

      - name: Run Smoke Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          echo "Starting Built Executable for Smoke Test..."

          exePath="dist/MemristorAnalysisTool/MemristorAnalysisTool"
          chmod +x "$exePath"

          "$exePath" --smoke-test &
          pid=$!

          sleep 10

          if kill -0 $pid 2>/dev/null; then
            echo "Smoke Test Passed: Application is running (forcing shutdown now)."
            kill $pid
          else
            wait $pid
            exit_code=$?
            if [ $exit_code -ne 0 ]; then
              echo "SMOKE TEST FAILED: Application crashed with exit code $exit_code"
              exit 1
            else
              echo "Smoke Test Passed: Application initialized and exited cleanly."
            fi
          fi
