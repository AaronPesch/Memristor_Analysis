<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Memristor live plots</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; font-family: system-ui, sans-serif; }
    #grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
            gap: 6px; height: 100%; box-sizing: border-box; padding: 2px; }
    .cell { min-width: 0; min-height: 0; }
    #boot { position: absolute; inset: 0; display: flex; align-items: center;
            justify-content: center; color: #888; font-size: 14px; }
  </style>

  <!-- Both files are copied here by demo.py on startup, out of the plotly and
       Qt packages. Loaded once for the whole application; nothing is fetched
       from the network. Compare with the old path, where every generated HTML
       file carried its own 4 MB copy of plotly.js. -->
  <script src="plotly.min.js"></script>
  <script src="qwebchannel.js"></script>
</head>
<body>
  <div id="boot">connecting to Python ...</div>
  <div id="grid" style="visibility:hidden">
    <div class="cell" id="map"></div>
    <div class="cell" id="scatter"></div>
    <div class="cell" id="cdf"></div>
    <div class="cell" id="endurance"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
